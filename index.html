<meta name="theme-color" content="#1c3227">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
(function () {
  var search = "";
  var hash = "";
  var dest = "/home.html";
  try {
    search = String(location.search || "");
    hash = String(location.hash || "");
    var q = new URLSearchParams(search);
    var leadSlug = String(q.get("p") || "").trim();
    var withSlug = String(q.get("with") || "").trim();
    var door = String(q.get("door") || "").trim();
    if (!leadSlug && !withSlug && hash) {
      var hm = hash.match(/(?:^|[?#&])(p|with)=([^&]+)/i);
      if (hm) {
        if (String(hm[1]).toLowerCase() === "p") leadSlug = decodeURIComponent(hm[2] || "").trim();
        else withSlug = decodeURIComponent(hm[2] || "").trim();
      }
    }
    var path = String(location.pathname || "");
    if (!leadSlug && !withSlug) {
      var pm = path.match(/\/with\/([a-z0-9][a-z0-9-]{1,38})\/?$/i);
      if (pm) withSlug = decodeURIComponent(pm[1] || "").trim();
    }
    if (leadSlug && !withSlug) dest = "/lead.html";
    else if (withSlug || door || /\/with\/[a-z0-9]/i.test(path) || /^#(connect|hub|ringana|why|faq)(\b|$)/i.test(hash)) dest = "/business.html";
    else hash = "";
  } catch (e) {}
  var url = dest + search + hash;
  var refresh = document.createElement("meta");
  refresh.httpEquiv = "refresh";
  refresh.content = "0;url=" + url;
  document.head.appendChild(refresh);
  location.replace(url);
})();
</script>
</head>
<body>
<p><a id="go" href="/home.html">The Fresh Grove</a></p>
<script>
(function () {
  var go = document.getElementById("go");
  if (!go) return;
  try {
    var q = new URLSearchParams(location.search);
    if (q.get("with") || q.get("door") || /^#(connect|hub|ringana|why|faq)/i.test(location.hash || "")) {
      go.href = "/business.html" + location.search + location.hash;
      go.textContent = "The business";
    } else if (q.get("p")) {
      go.href = "/lead.html" + location.search + location.hash;
    }
  } catch (e) {}
})();
</script>
</body>
</html>
