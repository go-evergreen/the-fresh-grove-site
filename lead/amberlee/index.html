<meta name="robots" content="noindex">

<link rel="canonical" href="https://thefreshgrove.team/lead/amberlee">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thefreshgrove.team/lead/amberlee">

<meta property="og:image" content="https://thefreshgrove.team/assets/og-image.jpg?v=2">
<script>
/* Stay on /lead/slug. A hop to ?p= gets stripped by Instagram and
   lands on the empty "isn't live yet" page. */
(function () {
  var fallback = "/lead.html?p=amberlee#p=amberlee";
  fetch("/lead.html", { credentials: "same-origin", cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("missing");
    return res.text();
  }).then(function (html) {
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    location.replace(fallback);
  });
})();
</script>
</head>
<body>
<p><a href="/lead.html?p=amberlee#p=amberlee">Continue to the lead page</a></p>
</body>
