<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Seeds</title>
<meta http-equiv="refresh" content="0;url=https://app.thefreshgrove.team/index.html">
</head>
<body>
<p><a id="go" href="https://app.thefreshgrove.team/index.html">Open First Seeds</a></p>
<script>
(function () {
  var next = new URL("https://app.thefreshgrove.team/index.html");
  try {
    var cur = new URL(location.href);
    cur.searchParams.forEach(function (v, k) {
      if (k === "fsbust") return;
      next.searchParams.append(k, v);
    });
    if (cur.hash) next.hash = cur.hash;
  } catch (eUrl) {}
  var href = next.href;
  var link = document.getElementById("go");
  if (link) link.href = href;
  function go() { location.replace(href); }
  go();
  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).catch(function () {});
    }
  } catch (eSw) {}
  try {
    if (window.caches) {
      caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {});
    }
  } catch (eCache) {}
})();
</script>
</body>
</html>
