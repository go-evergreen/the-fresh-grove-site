<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fresh Grove</title>
<meta name="robots" content="noindex">
</head>
<body>
<script>
(function () {
  var host = String(location.hostname || "").toLowerCase();
  var path = String(location.pathname || "/");
  var search = String(location.search || "");
  var hash = String(location.hash || "");
  var joinFromJ = String(path || "").match(/\/j\/([a-z0-9][a-z0-9-]{2,62})\/?$/i);
  if (joinFromJ) {
    var jCode = decodeURIComponent(joinFromJ[1] || "").trim().toLowerCase();
    /* This is the Grove door. Evergreen has its own host — do not hop. */
    var dest = "https://app.thefreshgrove.team/index.html?join=" +
      encodeURIComponent(jCode) + "&hub=grove" +
      "#join=" + encodeURIComponent(jCode);
    location.replace(dest);
    return;
  }
  var joinHost = host === "join.thefreshgrove.team";
  var joinPath = /^\/join(\/|\.html|$)/i.test(path);
  if (joinHost || joinPath) {
    var segs = path.replace(/\/+$/, "").split("/");
    var tail = segs.pop() || "";
    var extra = search;
    if (tail && !/^join(\.html)?$/i.test(tail) && !/[?&]join=/.test(search)) {
      extra = (search ? search + "&" : "?") + "join=" + encodeURIComponent(tail);
      if (!hash) hash = "#join=" + encodeURIComponent(tail.toLowerCase());
    }
    location.replace("/join.html" + extra + hash);
    return;
  }
  var prettyLead = String(path || "").match(/\/(ringana-with-[a-z0-9-]+)\/?$/i);
  var prettyHops = {
    "ringana-with-brittany": "https://go-evergreen.github.io/ringana-with-brittany/",
    "ringana-with-the-smallwoods": "https://go-evergreen.github.io/ringana-with-the-smallwoods/",
    "ringana-with-tania": "https://go-evergreen.github.io/ringana-with-tania/",
    "ringana-with-kim": "https://go-evergreen.github.io/ringana-with-kim/",
    "ringana-with-kelly": "https://go-evergreen.github.io/ringana-with-kelly/",
    "ringana-with-kassidy": "https://go-evergreen.github.io/ringana-with-kassidy/"
  };
  if (prettyLead && prettyHops[prettyLead[1].toLowerCase()]) {
    location.replace(prettyHops[prettyLead[1].toLowerCase()] + search + hash);
    return;
  }
  if (/^\/lead(\/|\.html|$)/i.test(path) || /[?&](?:p|with)=/.test(search) || /[#&?](?:p|with)=/.test(hash)) {
    location.replace("https://app.thefreshgrove.team/lead.html" + search + hash);
    return;
  }
  if (/^\/thefreshcatalog(\/|\.html|$)/i.test(path)) {
    location.replace("/thefreshcatalog");
    return;
  }
  location.replace("/" + search + hash);
})();
</script>
<p><a href="/">Back to The Fresh Grove</a></p>
</body>
</html>
